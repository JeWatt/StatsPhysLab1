# Conda environment for the coin-microstates project.
#
# Create it once:      conda env create -f environment.yml
# Activate it:         conda activate coin-microstates
# Update after edits:  conda env update -f environment.yml --prune
#
# Only conda-forge is used. Mixing it with Anaconda's "defaults" channel
# (note: the name is "defaults", with an s) often makes conda slow or gives
# conflicting packages, so one channel is the safer choice.
#
# NumPy >= 2.0 provides np.bitwise_count (hardware popcount), which makes the
# Part 1b benchmark ~2x faster; older NumPy still works through a slower
# look-up table.
name: coin-microstates
channels:
  - conda-forge
dependencies:
  - python>=3.10
  # required by the programs
  - numpy>=2.0
  - matplotlib>=3.7
  # runs the automatic checks in test_coin_microstates.py ("pytest")
  - pytest>=7.0
  # optional: not used by the programs, kept for your own experiments
  - scipy>=1.10
  - jupyter
